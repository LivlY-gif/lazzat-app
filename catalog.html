<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lazzat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#15110f; --card:#211a17; --card2:#2a211d; --text:#f3ead9; --muted:#a89a85;
  --gold:#d4a95a; --gold-dark:#b98c3e; --line:#3a2e27; --cream:#f1e7d3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:0 16px 40px;max-width:560px;margin:0 auto}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}

header{display:flex;align-items:center;gap:14px;padding:18px 0 8px}
.logo{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--gold);flex:none}
.logo-fallback{width:56px;height:56px;border-radius:50%;background:var(--gold);color:#1b1511;
  display:flex;align-items:center;justify-content:center;font:700 22px Georgia,serif;flex:none}
header .ttl{flex:1;min-width:0}
header h1{margin:0;font:700 26px Georgia,"Times New Roman",serif;letter-spacing:.5px;color:var(--gold)}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang button{background:var(--card);border:0;color:var(--muted);padding:8px 11px;font-size:13px;font-weight:600;cursor:pointer}
.lang button.on{background:var(--gold);color:#1b1511}

h2.sec{font:700 20px Georgia,"Times New Roman",serif;color:var(--gold);margin:28px 0 12px}
.about{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;
  font-size:14.5px;line-height:1.5;color:var(--text)}
.about p{margin:0 0 10px}.about p:last-child{margin:0}

.card{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:16px;padding:12px;margin-bottom:12px}
.pic{width:104px;flex:none;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{width:100%;height:150px;object-fit:contain;mix-blend-mode:multiply}
.info{flex:1;min-width:0}
.info h3{margin:0;font:700 18px Georgia,"Times New Roman",serif}
.vol{color:var(--gold);font-size:13px;margin-top:2px}
.desc{margin:8px 0;color:var(--muted);font-size:13.5px;line-height:1.4}
.price{font-size:13.5px;line-height:1.5}
.price span{color:var(--muted)}

.facts{display:grid;gap:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4}
.fact b{display:block;color:var(--gold);font-size:12.5px;font-weight:600;letter-spacing:.3px;margin-bottom:3px;text-transform:uppercase}

.factory{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:14.5px;line-height:1.5}
.factory .addr{font-weight:600;margin-bottom:12px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{flex:1 1 140px;text-align:center;border:1px solid var(--line);background:var(--card2);color:var(--text);
  border-radius:12px;padding:12px 14px;font-size:14.5px;font-weight:600}
.btn:active{background:var(--gold);color:#1b1511}

.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--card)}

.card{cursor:pointer}
.card:active{background:var(--card2)}
.more{color:var(--gold);font-size:13px;margin-top:8px}
.tap{color:var(--muted);font-size:12.5px;margin:-4px 0 12px}
#detail .hero{background:var(--cream);border-radius:20px;padding:18px;margin-top:8px;display:flex;justify-content:center;
  border-bottom:6px solid var(--accent)}
#detail .hero img{height:300px;max-width:100%;object-fit:contain;mix-blend-mode:multiply}
#detail h2{font:700 26px Georgia,serif;margin:18px 0 2px}
#detail .vol{font-size:14px}
#detail .long{font-size:15px;line-height:1.55;margin:12px 0}
#detail .pbox{display:flex;gap:10px;margin:14px 0}
#detail .pbox div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted)}
#detail .pbox b{display:block;color:var(--text);font-size:16px;margin-top:3px}
.back{background:none;border:0;color:var(--gold);font-size:15px;padding:12px 0 0;cursor:pointer}
</style>
</head>
<body>

<header>
  <img class="logo" id="logo" src="img/logo.png" alt="Lazzat">
  <div class="ttl"><h1>Lazzat</h1><p id="tagline"></p></div>
  <div class="lang"><button id="lru">RU</button><button id="luz">UZ</button></div>
</header>

<div id="home">
<div class="about" id="about"></div>

<h2 class="sec" id="hDrinks"></h2>
<div id="list"></div>

<h2 class="sec" id="hFactory"></h2>
<div class="factory">
  <div class="addr" id="fAddr"></div>
  <div class="btns">
    <a class="btn" id="mGoogle" target="_blank" rel="noopener"></a>
    <a class="btn" id="mYandex" target="_blank" rel="noopener"></a>
  </div>
</div>

<div id="galleryWrap" hidden>
  <h2 class="sec" id="hPhotos"></h2>
  <div class="gallery" id="gallery"></div>
</div>

<div id="contactsWrap" hidden>
  <h2 class="sec" id="hContacts"></h2>
  <div class="btns" id="contacts"></div>
</div>

</div>

<div id="detail" hidden></div>

<script>
/* =====================  НАСТРОЙКИ (меняйте здесь)  ===================== */
// Контакты. Пустое значение = кнопка не показывается.
const CONTACT = {
  phone:     '',   // например '+998901234567'
  telegram:  '',   // например '@lazzat_manager'
  instagram: ''    // например 'lazzat.uz' или полная ссылка
};
// Фото для раздела «Фото завода»: положите файлы в папку img и впишите имена, например ['factory1.jpg','factory2.jpg'].
// Пока список пуст, раздел скрыт.
const GALLERY = [];
// Цены только для показа. Настоящие цены считает бот (DRINKS в bot.py).
const BLOCK = 12, MIN = 5;
const FACTORY = { lat: 41.3729019, lon: 69.2611986,
  google: 'https://maps.app.goo.gl/wFz1qzcHqwc8KyVU6' };

const DRINKS = [
  { name: 'Anor Lemonade',   price: 7301, color: '#7a1f2b', img: 'img/anor.jpg',   vol: { ru: '0,5 л',  uz: '0,5 l' },
    desc: { ru: 'Лимонад с насыщенным вкусом граната.', uz: "To'yingan anor ta'mli limonad." },
    long: { ru: 'Яркий, насыщенный вкус граната. Лучше всего холодным: в жару, за обедом или на семейном столе.', uz: "Anorning yorqin, to'yingan ta'mi. Eng yaxshisi sovuq holda: issiq kunda, tushlikda yoki oilaviy dasturxonda." } },
  { name: "Jo'xori Lemonade", price: 8400, color: '#27407f', img: 'img/joxori.jpg', vol: { ru: '0,45 л', uz: '0,45 l' },
    desc: { ru: 'Необычный лимонад со вкусом сладкой кукурузы.', uz: "Shirin makkajo'xori ta'mli noodatiy limonad." },
    long: { ru: 'Необычный вкус сладкой кукурузы в газированном лимонаде. Напиток, который запоминается и отличается от привычных.', uz: "Gazli limonadda shirin makkajo'xorining noodatiy ta'mi. Esda qoladigan va odatiy ichimliklardan farq qiladigan ichimlik." } },
  { name: 'Moxito Lemonade', price: 7301, color: '#2f6a2b', img: 'img/moxito.jpg', vol: { ru: '0,5 л',  uz: '0,5 l' },
    desc: { ru: 'Освежающий мохито с лаймом, мятой и клубникой.', uz: "Laym, yalpiz va qulupnay ta'mli sarin moxito." },
    long: { ru: 'Освежающий мохито с лаймом, мятой и клубникой. Лёгкий, прохладный вкус для жаркого дня и компании друзей.', uz: "Laym, yalpiz va qulupnayli sarin moxito. Issiq kun va do'stlar davrasi uchun yengil, salqin ta'm." } },
  { name: 'Qovun Lemonade',  price: 7301, color: '#3f5a2a', img: 'img/qovun.jpg',  vol: { ru: '0,45 л', uz: '0,45 l' },
    desc: { ru: 'Лимонад со вкусом сочной спелой дыни.', uz: "Shirali pishgan qovun ta'mli limonad." },
    long: { ru: 'Вкус сочной спелой дыни в газированном лимонаде. Сладкий летний вкус, который хочется пить холодным.', uz: "Gazli limonadda shirali pishgan qovun ta'mi. Sovuq holda ichgisi keladigan shirin yozgi ta'm." } }
];

const I18N = {
  ru: {
    tagline: 'Газированные лимонады', cur: 'сум',
    about: ['<b>Lazzat</b> — газированные лимонады с яркими и необычными вкусами: гранат, кукуруза, мохито с клубникой и спелая дыня.',
            'Мы делаем напитки, которые приятно пить в жару и за столом с друзьями. Работаем с магазинами, кафе и обычными покупателями.'],
    hDrinks: 'Наши напитки', perCan: 'за банку', perBlock: 'Блок из 12 банок',
    hWork: 'Как заказать',
    facts: [['Продажа блоками', '1 блок = 12 банок. Минимальный заказ — 5 блоков.'],
            ['Доставка', 'Ташкент, Юнусабадский район.'],
            ['Оплата', 'При получении заказа.']],
    hFactory: 'Наш завод', addr: 'г. Ташкент, ул. Гулор, 38', google: 'Google Maps', yandex: 'Яндекс Карты',
    hPhotos: 'Фото', hContacts: 'Связаться с нами', call: '📞 Позвонить', back: '← Назад', more: 'Подробнее'
  },
  uz: {
    tagline: 'Gazli limonadlar', cur: "so'm",
    about: ["<b>Lazzat</b> — yorqin va noodatiy ta'mli gazli limonadlar: anor, makkajo'xori, qulupnayli moxito va pishgan qovun.",
            "Biz issiq kunda ham, do'stlar davrasida ham ichishga yoqimli ichimliklar tayyorlaymiz. Do'konlar, kafelar va oddiy xaridorlar bilan ishlaymiz."],
    hDrinks: 'Ichimliklarimiz', perCan: 'bankasi', perBlock: '12 dona banka (1 blok)',
    hWork: 'Qanday buyurtma berish',
    facts: [['Bloklab sotish', '1 blok = 12 dona banka. Minimal buyurtma — 5 blok.'],
            ['Yetkazib berish', 'Toshkent, Yunusobod tumani.'],
            ["To'lov", 'Buyurtmani qabul qilishda.']],
    hFactory: 'Bizning zavod', addr: "Toshkent shahri, Gulor ko'chasi, 38", google: 'Google Maps', yandex: 'Yandex Xaritalar',
    hPhotos: 'Suratlar', hContacts: "Biz bilan bog'lanish", call: "📞 Qo'ng'iroq qilish", back: '← Orqaga', more: 'Batafsil'
  }
};

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#15110f'); tg.setBackgroundColor('#15110f'); } catch (e) {} }

/* язык: ?lang=… → сохранённый выбор → язык Telegram → русский */
function detectLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'uz' || q === 'ru') return q;
  try { const s = localStorage.getItem('lazzat_lang'); if (s === 'uz' || s === 'ru') return s; } catch (e) {}
  try { if (tg.initDataUnsafe.user.language_code === 'uz') return 'uz'; } catch (e) {}
  return 'ru';
}
let lang = detectLang();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const safeUrl = u => /^https?:\/\//.test(u) ? u : '';

function render() {
  const t = I18N[lang], money = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ' + t.cur;
  document.documentElement.lang = lang;
  $('lru').className = lang === 'ru' ? 'on' : ''; $('luz').className = lang === 'uz' ? 'on' : '';
  $('tagline').textContent = t.tagline;
  $('about').innerHTML = t.about.map(p => `<p>${p}</p>`).join('');
  $('hDrinks').textContent = t.hDrinks;
  $('list').innerHTML = DRINKS.map((d, i) => `
    <div class="card" data-i="${i}" style="--accent:${d.color}">
      <div class="pic"><img src="${d.img}" alt="${esc(d.name)}" onerror="this.parentNode.style.display='none'"></div>
      <div class="info">
        <h3>${esc(d.name)}</h3>
        <div class="vol">${d.vol[lang]}</div>
        <div class="desc">${d.desc[lang]}</div>
        <div class="price">${money(d.price)} <span>${t.perCan}</span><br>
          <span>${t.perBlock}:</span> ${money(d.price * BLOCK)}</div>
        <div class="more">${t.more} →</div>
      </div>
    </div>`).join('');
  $('hFactory').textContent = t.hFactory;
  $('fAddr').textContent = t.addr;
  $('mGoogle').textContent = '📍 ' + t.google; $('mGoogle').href = FACTORY.google;
  $('mYandex').textContent = '📍 ' + t.yandex;
  $('mYandex').href = `https://yandex.com/maps/?pt=${FACTORY.lon},${FACTORY.lat}&z=17&l=map`;

  $('galleryWrap').hidden = GALLERY.length === 0;
  if (GALLERY.length) {
    $('hPhotos').textContent = t.hPhotos;
    $('gallery').innerHTML = GALLERY.map(f => `<img src="img/${esc(f)}" alt="" loading="lazy" onerror="this.remove()">`).join('');
  }

  const btns = [];
  const phone = CONTACT.phone.replace(/[^\d+]/g, '');
  if (phone) btns.push(`<a class="btn" href="tel:${phone}">${t.call}</a>`);
  const tgName = CONTACT.telegram.trim();
  const tgUrl = tgName ? (safeUrl(tgName) || 'https://t.me/' + tgName.replace(/^@/, '').replace(/\/+$/, '')) : '';
  if (tgUrl && !/\s/.test(tgUrl)) btns.push(`<a class="btn" href="${esc(tgUrl)}" data-tg>✈️ Telegram</a>`);
  const ig = CONTACT.instagram.trim();
  const igUrl = ig ? (safeUrl(ig) || 'https://instagram.com/' + ig.replace(/^@/, '').replace(/\/+$/, '')) : '';
  if (igUrl && !/\s/.test(igUrl)) btns.push(`<a class="btn" href="${esc(igUrl)}" target="_blank" rel="noopener">📸 Instagram</a>`);
  $('contactsWrap').hidden = btns.length === 0;
  $('hContacts').textContent = t.hContacts;
  $('contacts').innerHTML = btns.join('');

  }

function showDetail(i) {
  const d = DRINKS[i], t = I18N[lang], money = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ' + t.cur;
  $('detail').innerHTML = `
    <button class="back" id="backBtn">${t.back}</button>
    <div class="hero" style="--accent:${d.color}"><img src="${d.img}" alt="${esc(d.name)}" onerror="this.parentNode.style.display='none'"></div>
    <h2>${esc(d.name)}</h2>
    <div class="vol">${d.vol[lang]}</div>
    <div class="long">${d.long[lang]}</div>
    <div class="pbox"><div>${t.perCan}<b>${money(d.price)}</b></div><div>${t.perBlock}<b>${money(d.price * BLOCK)}</b></div></div>`;
  $('home').hidden = true; $('detail').hidden = false; window.scrollTo(0, 0);
  $('backBtn').onclick = hideDetail;
  try { tg.BackButton.show(); tg.BackButton.onClick(hideDetail); } catch (e) {}
}
function hideDetail() {
  $('detail').hidden = true; $('home').hidden = false; openIdx = null;
  try { tg.BackButton.hide(); tg.BackButton.offClick(hideDetail); } catch (e) {}
}
let openIdx = null;
$('list').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (c) { openIdx = +c.dataset.i; showDetail(openIdx); }
});
function setLang(l) {
  lang = l; try { localStorage.setItem('lazzat_lang', l); } catch (e) {}
  render(); if (openIdx !== null) showDetail(openIdx);
}
$('lru').onclick = () => setLang('ru');
$('luz').onclick = () => setLang('uz');
$('logo').onerror = function () {
  const f = document.createElement('div'); f.className = 'logo-fallback'; f.textContent = 'L'; this.replaceWith(f);
};
// Ссылки на Telegram открываем средствами Telegram, остальные — обычным переходом.
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-tg]');
  if (a && tg && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink(a.href); }
});

render();
</script>
</body>
</html>
